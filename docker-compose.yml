services:
  app:
    build:
      args:
        container_project_path: /var/www/html/
        uid: 1000
        user: alamia
      context: .
      dockerfile: ./Dockerfile
    image: ${IMAGE_NAME:-alamiaconnect-php-apache}
    container_name: ${PROJECT_NAME:-alamia}-app
    environment:
      - BACKEND_REPO_URL=${BACKEND_REPO_URL}
      - BACKEND_REPO_BRANCH=${BACKEND_REPO_BRANCH:-main}
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost}
      - DB_HOST=db
      - DB_DATABASE=alamiaconnect
      - DB_PASSWORD=${DB_PASSWORD:-root}
    ports:
      - ${APP_PORT:-9001}:80
    volumes:
      - ./workspace/:/var/www/html/
      - ./.configs/:/var/www/html/.configs/
    restart: always

  db:
    image: mysql:8.0
    container_name: ${PROJECT_NAME:-alamia}-db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: alamiaconnect
    volumes:
      - ./.configs/mysql-data:/var/lib/mysql/
    restart: always

  redis:
    image: redis:6.2-alpine
    container_name: ${PROJECT_NAME:-alamia}-redis
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - ./.configs/redis-data:/data
    restart: always

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ${PROJECT_NAME:-alamia}-pma
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD:-root}
      UPLOAD_LIMIT: 512M
    ports:
      - ${PMA_PORT:-8080}:80
    restart: always

  frontend:
    build:
      context: ../../../AlamiaConnect-Frontnd # Corrected: 3 levels up from clients/ktd/prod
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${APP_URL}/api/v1
    container_name: ${PROJECT_NAME:-alamia}-frontend
    environment:
      - NEXT_PUBLIC_API_URL=${APP_URL}/api/v1
    ports:
      - ${FRONTEND_PORT:-3000}:3000
    restart: always
    depends_on:
      - app

  mailhog:
    image: mailhog/mailhog
    container_name: ${PROJECT_NAME:-alamia}-mailhog
    logging:
      driver: 'none'
    restart: always
