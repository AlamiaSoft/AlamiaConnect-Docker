version: "3.1"

services:
  alamiaconnect-php-apache:
    build:
      args:
        container_project_path: /var/www/html/
        uid: 33
        user: www-data
      context: .
      dockerfile: ./Dockerfile
    image: alamiaconnect-php-apache
    ports:
      - 8081:80
    volumes:
      - ./workspace/:/var/www/html/

  alamiaconnect-mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: root
    ports:
      - 3307:3306
    volumes:
      - ./.configs/mysql-data:/var/lib/mysql/

  alamiaconnect-redis:
    image: redis:6.2-alpine
    ports:
      - 6379:6379
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - ./.configs/redis-data:/data

  alamiaconnect-phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: alamiaconnect-mysql
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 512M
    ports:
      - 8080:80

  alamiaconnect-mailhog:
    image: mailhog/mailhog
    logging:
      # Disable saving logs.
      driver: 'none'
    ports:
      # SMTP server.
      - 1025:1025
      - 8025:8025
